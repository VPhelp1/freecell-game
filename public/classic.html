<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic FreeCell</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d5f0d; color: white; overflow-x: auto; user-select: none;
        }
        .game-container { 
            min-width: 700px; padding: 15px; margin: 0 auto; max-width: 1000px;
        }
        .header { 
            text-align: center; margin-bottom: 20px; 
            background: rgba(0,0,0,0.4); padding: 15px; border-radius: 10px;
        }
        .controls { 
            display: flex; justify-content: center; gap: 10px; 
            flex-wrap: wrap; margin-bottom: 20px;
        }
        button { 
            padding: 10px 20px; background: #2c5aa0; color: white; 
            border: none; border-radius: 6px; cursor: pointer; 
            font-size: 14px; transition: all 0.2s;
        }
        button:hover { background: #1e3d6f; transform: translateY(-1px); }
        button:disabled { background: #666; cursor: not-allowed; transform: none; }
        
        .game-board { min-height: 450px; }
        .top-area { 
            display: flex; justify-content: space-between; gap: 20px; 
            margin-bottom: 15px; padding: 10px 0;
        }
        .freecells-area, .foundations-area { display: flex; gap: 10px; }
        
        .cell, .foundation { 
            width: 75px; height: 105px; border: 2px solid #555; 
            border-radius: 8px; background: rgba(0,0,0,0.3); 
            position: relative; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer;
        }
        .cell.highlight, .foundation.highlight { 
            border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.4); 
        }
        
        .tableau { 
            display: flex; gap: 10px; justify-content: center; 
            flex-wrap: nowrap; overflow-x: auto; padding: 10px 0;
        }
        .tableau-pile { 
            min-width: 75px; min-height: 105px; border: 2px dashed #555; 
            border-radius: 8px; background: rgba(0,0,0,0.2); 
            position: relative; flex-shrink: 0; transition: all 0.2s;
        }
        .tableau-pile.highlight { 
            border-color: #ffd700; border-style: solid; 
            background: rgba(255,215,0,0.1);
        }
        
        .card { 
            width: 71px; height: 101px; background: white; color: #000; 
            border: 1px solid #333; border-radius: 6px; 
            display: flex; flex-direction: column; justify-content: space-between; 
            padding: 6px; font-weight: bold; font-size: 13px; 
            cursor: pointer; position: absolute; left: 2px;
            transition: all 0.15s; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .card:hover { 
            transform: scale(1.03); z-index: 10; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        .card.selected { 
            border: 3px solid #00aaff; transform: scale(1.08); 
            box-shadow: 0 0 20px rgba(0,170,255,0.7); z-index: 15;
        }
        .card.hearts, .card.diamonds { color: #d32f2f; }
        .card.spades, .card.clubs { color: #000; }
        
        .card-top, .card-bottom { 
            display: flex; align-items: center; justify-content: space-between;
        }
        .card-bottom { 
            transform: rotate(180deg); opacity: 0.6; 
        }
        .suit-symbol { font-size: 18px; }
        .rank { font-size: 14px; font-weight: bold; }
        
        .status-bar { 
            background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; 
            text-align: center; margin-top: 15px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px;
        }
        .stat { font-size: 16px; }
        
        .win-message { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: linear-gradient(135deg, #4caf50, #45a049); 
            color: white; padding: 40px; border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; 
            z-index: 100; display: none; animation: bounceIn 0.6s;
        }
        
        @keyframes bounceIn { 
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } 
            50% { transform: translate(-50%, -50%) scale(1.05); } 
            70% { transform: translate(-50%, -50%) scale(0.9); } 
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 
        }
        
        .loading { 
            text-align: center; padding: 20px; background: rgba(255,255,255,0.1); 
            border-radius: 10px; margin: 20px 0;
        }
        
        .error-message {
            background: rgba(220, 53, 69, 0.2); border: 1px solid #dc3545;
            color: #ff6b6b; padding: 15px; border-radius: 8px; margin: 15px 0;
            text-align: center; display: none;
        }
        
        @media (max-width: 800px) {
            .game-container { min-width: auto; padding: 10px; }
            .card { width: 60px; height: 85px; font-size: 11px; }
            .cell, .foundation { width: 64px; height: 89px; font-size: 20px; }
            .tableau-pile { min-width: 64px; min-height: 89px; }
            .suit-symbol { font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🎮 Classic FreeCell</h1>
            <p>Перемістіть всі карти в фундаменти від туза до короля</p>
        </div>

        <div class="controls">
            <button onclick="newGame()" id="new-game-btn">🎲 Нова гра</button>
            <button onclick="autoMove()" id="auto-move-btn" disabled>⚡ Авто-хід</button>
            <button onclick="undoMove()" id="undo-btn" disabled>↶ Відмінити</button>
            <button onclick="showRules()" id="rules-btn">📋 Правила</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            🎲 Підключення до сервера...
        </div>
        
        <div id="error-message" class="error-message"></div>

        <div class="game-board" id="game-board">
            <div class="top-area">
                <div class="freecells-area" title="Вільні комірки">
                    <div class="cell" data-type="freeCell" data-index="0"></div>
                    <div class="cell" data-type="freeCell" data-index="1"></div>
                    <div class="cell" data-type="freeCell" data-index="2"></div>
                    <div class="cell" data-type="freeCell" data-index="3"></div>
                </div>
                
                <div class="foundations-area" title="Фундаменти">
                    <div class="foundation" data-type="foundation" data-suit="hearts">♥</div>
                    <div class="foundation" data-type="foundation" data-suit="diamonds">♦</div>
                    <div class="foundation" data-type="foundation" data-suit="clubs">♣</div>
                    <div class="foundation" data-type="foundation" data-suit="spades">♠</div>
                </div>
            </div>
            
            <div class="tableau" id="tableau">
                <div class="tableau-pile" data-type="tableau" data-index="0"></div>
                <div class="tableau-pile" data-type="tableau" data-index="1"></div>
                <div class="tableau-pile" data-type="tableau" data-index="2"></div>
                <div class="tableau-pile" data-type="tableau" data-index="3"></div>
                <div class="tableau-pile" data-type="tableau" data-index="4"></div>
                <div class="tableau-pile" data-type="tableau" data-index="5"></div>
                <div class="tableau-pile" data-type="tableau" data-index="6"></div>
                <div class="tableau-pile" data-type="tableau" data-index="7"></div>
            </div>
        </div>

        <div class="status-bar">
            <div class="stat">Ходів: <span id="move-count">0</span></div>
            <div class="stat" id="game-status">Натисніть "Нова гра"</div>
            <div class="stat">Час: <span id="timer">00:00</span></div>
        </div>
    </div>

    <div class="win-message" id="win-message">
        <h2>🏆 Вітаю!</h2>
        <p>Ви успішно завершили Classic FreeCell!</p>
        <p>Ходів: <span id="final-moves">0</span> | Час: <span id="final-time">00:00</span></p>
        <button onclick="newGame()" style="margin-top: 15px; padding: 12px 24px; font-size: 16px;">🎮 Грати знову</button>
    </div>

    <script>
        // Configuration
        const API_BASE = window.location.hostname.includes('localhost') || window.location.hostname.includes('127.0.0.1')
            ? 'http://localhost:3001/api/games'
            : '/api/games'; // For production

        // Game state
        let currentGameId = null;
        let gameState = null;
        let selectedCard = null;
        let selectedLocation = null;
        let moveCount = 0;
        let gameStartTime = null;
        let timerInterval = null;
        let moveHistory = [];

        // Suit symbols
        const SUIT_SYMBOLS = { hearts: '♥', diamonds: '♦', clubs: '♣', spades: '♠' };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            showStatus('Готово до гри. Натисніть "Нова гра"');
        });

        async function newGame() {
            showLoading(true);
            clearSelection();
            
            try {
                const response = await fetch(`${API_BASE}/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gameType: 'freecell' })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    currentGameId = data.data.gameId;
                    gameState = data.data.gameState;
                    moveCount = 0;
                    moveHistory = [];
                    
                    updateDisplay();
                    startTimer();
                    enableControls();
                    showStatus('Гра розпочата! Оберіть карту для ходу');
                    hideError();
                    
                } else {
                    throw new Error(data.error || 'Невідома помилка сервера');
                }
            } catch (error) {
                console.error('Помилка створення гри:', error);
                showError(`Помилка підключення: ${error.message}. Перевірте інтернет з'єднання.`);
                showStatus('Помилка створення гри');
                disableControls();
            } finally {
                showLoading(false);
            }
        }

        function enableControls() {
            document.getElementById('auto-move-btn').disabled = false;
            document.getElementById('undo-btn').disabled = moveHistory.length === 0;
        }

        function disableControls() {
            document.getElementById('auto-move-btn').disabled = true;
            document.getElementById('undo-btn').disabled = true;
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('game-board').style.opacity = show ? '0.5' : '1';
        }

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => hideError(), 5000);
        }

        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }

        function showStatus(message) {
            document.getElementById('game-status').textContent = message;
        }

        function updateDisplay() {
            if (!gameState) return;

            // Clear existing cards
            document.querySelectorAll('.card').forEach(card => card.remove());
            
            // Update move count
            document.getElementById('move-count').textContent = moveCount;

            // Render freecells
            gameState.freeCells.forEach((card, index) => {
                const cell = document.querySelector(`[data-type="freeCell"][data-index="${index}"]`);
                cell.innerHTML = '';
                if (card) {
                    const cardElement = createCardElement(card);
                    cell.appendChild(cardElement);
                }
            });

            // Render foundations
            Object.entries(gameState.foundations).forEach(([suit, pile]) => {
                const foundation = document.querySelector(`[data-type="foundation"][data-suit="${suit}"]`);
                foundation.innerHTML = SUIT_SYMBOLS[suit];
                if (pile.length > 0) {
                    const topCard = pile[pile.length - 1];
                    const cardElement = createCardElement(topCard);
                    foundation.appendChild(cardElement);
                }
            });

            // Render tableau
            gameState.tableau.forEach((pile, pileIndex) => {
                const tableauPile = document.querySelector(`[data-type="tableau"][data-index="${pileIndex}"]`);
                tableauPile.innerHTML = '';
                
                pile.forEach((card, cardIndex) => {
                    const cardElement = createCardElement(card);
                    cardElement.style.top = `${cardIndex * 25}px`;
                    cardElement.style.zIndex = cardIndex + 1;
                    
                    // Only top card is clickable
                    if (cardIndex === pile.length - 1) {
                        cardElement.style.cursor = 'pointer';
                        cardElement.addEventListener('click', (e) => handleCardClick(e, card));
                    } else {
                        cardElement.style.cursor = 'default';
                        cardElement.style.opacity = '0.9';
                    }
                    
                    tableauPile.appendChild(cardElement);
                });
                
                // Adjust pile height
                if (pile.length > 0) {
                    tableauPile.style.minHeight = `${105 + (pile.length - 1) * 25}px`;
                }
                
                // Add click handler for empty piles
                if (pile.length === 0) {
                    tableauPile.onclick = () => handleEmptyPileClick('tableau', pileIndex);
                } else {
                    tableauPile.onclick = null;
                }
            });

            // Add click handlers for empty cells and foundations
            setupClickHandlers();

            // Check for win
            if (gameState.gameWon) {
                setTimeout(showWinMessage, 300);
            }

            // Update undo button
            document.getElementById('undo-btn').disabled = moveHistory.length === 0;
        }

        function createCardElement(card) {
            const cardEl = document.createElement('div');
            cardEl.className = `card ${card.suit}`;
            cardEl.dataset.cardId = card.id;
            
            const symbol = SUIT_SYMBOLS[card.suit];
            
            cardEl.innerHTML = `
                <div class="card-top">
                    <span class="rank">${card.rank}</span>
                    <span class="suit-symbol">${symbol}</span>
                </div>
                <div class="card-bottom">
                    <span class="rank">${card.rank}</span>
                    <span class="suit-symbol">${symbol}</span>
                </div>
            `;
            
            return cardEl;
        }

        function setupClickHandlers() {
            // Free cells
            gameState.freeCells.forEach((card, index) => {
                const cell = document.querySelector(`[data-type="freeCell"][data-index="${index}"]`);
                if (!card) {
                    cell.onclick = () => handleEmptyPileClick('freeCell', index);
                } else {
                    const cardEl = cell.querySelector('.card');
                    if (cardEl) {
                        cardEl.addEventListener('click', (e) => {
                            e.stopPropagation();
                            handleCardClick(e, card);
                        });
                    }
                }
            });

            // Foundations
            Object.entries(gameState.foundations).forEach(([suit, pile]) => {
                const foundation = document.querySelector(`[data-type="foundation"][data-suit="${suit}"]`);
                foundation.onclick = () => handleEmptyPileClick('foundation', suit);
                
                if (pile.length > 0) {
                    const cardEl = foundation.querySelector('.card');
                    if (cardEl) {
                        const topCard = pile[pile.length - 1];
                        cardEl.addEventListener('click', (e) => {
                            e.stopPropagation();
                            handleCardClick(e, topCard);
                        });
                    }
                }
            });
        }

        function handleCardClick(event, card) {
            event.stopPropagation();
            
            const cardElement = event.currentTarget;
            const location = getCardLocation(card);
            
            if (!location) {
                showStatus('Помилка: не знайдено місце розташування карти');
                return;
            }

            if (selectedCard && selectedLocation) {
                if (selectedCard.id === card.id) {
                    // Deselect the same card
                    clearSelection();
                    showStatus('Карту скасовано. Оберіть карту для ходу');
                } else {
                    // Try to move to this card's location
                    makeMove(selectedLocation, location);
                }
            } else {
                // Select this card
                selectCard(cardElement, card, location);
            }
        }

        function handleEmptyPileClick(type, indexOrSuit) {
            if (!selectedCard || !selectedLocation) {
                showStatus('Спочатку оберіть карту');
                return;
            }

            const destination = {
                type: type === 'freeCell' ? 'freeCell' : (type === 'foundation' ? 'foundation' : 'tableau'),
                ...(type === 'foundation' ? { key: indexOrSuit } : { index: indexOrSuit })
            };

            makeMove(selectedLocation, destination);
        }

        function selectCard(cardElement, card, location) {
            clearSelection();
            
            selectedCard = card;
            selectedLocation = location;
            
            cardElement.classList.add('selected');
            
            // Highlight valid destinations
            highlightValidMoves();
            
            showStatus(`Обрано: ${card.rank}${SUIT_SYMBOLS[card.suit]}. Оберіть куди перемістити`);
        }

        function clearSelection() {
            document.querySelectorAll('.card.selected').forEach(card => {
                card.classList.remove('selected');
            });
            document.querySelectorAll('.highlight').forEach(element => {
                element.classList.remove('highlight');
            });
            
            selectedCard = null;
            selectedLocation = null;
        }

        function highlightValidMoves() {
            if (!selectedCard || !gameState) return;

            // Highlight empty freecells
            gameState.freeCells.forEach((cell, index) => {
                if (cell === null) {
                    const cellEl = document.querySelector(`[data-type="freeCell"][data-index="${index}"]`);
                    cellEl.classList.add('highlight');
                }
            });

            // Highlight valid foundation moves
            Object.entries(gameState.foundations).forEach(([suit, pile]) => {
                if (isValidFoundationMove(selectedCard, pile)) {
                    const foundationEl = document.querySelector(`[data-type="foundation"][data-suit="${suit}"]`);
                    foundationEl.classList.add('highlight');
                }
            });

            // Highlight valid tableau moves
            gameState.tableau.forEach((pile, index) => {
                if (isValidTableauMove(selectedCard, pile)) {
                    const pileEl = document.querySelector(`[data-type="tableau"][data-index="${index}"]`);
                    pileEl.classList.add('highlight');
                }
            });
        }

        function getCardLocation(card) {
            // Check freecells
            for (let i = 0; i < gameState.freeCells.length; i++) {
                if (gameState.freeCells[i] && gameState.freeCells[i].id === card.id) {
                    return { type: 'freeCell', index: i };
                }
            }
            
            // Check foundations
            for (const [suit, pile] of Object.entries(gameState.foundations)) {
                if (pile.length > 0 && pile[pile.length - 1].id === card.id) {
                    return { type: 'foundation', key: suit };
                }
            }
            
            // Check tableau
            for (let i = 0; i < gameState.tableau.length; i++) {
                const pile = gameState.tableau[i];
                if (pile.length > 0 && pile[pile.length - 1].id === card.id) {
                    return { type: 'tableau', index: i };
                }
            }
            
            return null;
        }

        function isValidFoundationMove(card, pile) {
            if (pile.length === 0) {
                return card.rank === 'A';
            }
            
            const topCard = pile[pile.length - 1];
            return card.suit === topCard.suit && getRankValue(card.rank) === getRankValue(topCard.rank) + 1;
        }

        function isValidTableauMove(card, pile) {
            if (pile.length === 0) {
                return true;
            }
            
            const topCard = pile[pile.length - 1];
            const cardColor = getCardColor(card.suit);
            const topCardColor = getCardColor(topCard.suit);
            
            return cardColor !== topCardColor && getRankValue(card.rank) === getRankValue(topCard.rank) - 1;
        }

        function getCardColor(suit) {
            return ['hearts', 'diamonds'].includes(suit) ? 'red' : 'black';
        }

        function getRankValue(rank) {
            if (rank === 'A') return 1;
            if (rank === 'J') return 11;
            if (rank === 'Q') return 12;
            if (rank === 'K') return 13;
            return parseInt(rank);
        }

        async function makeMove(from, to) {
            if (!currentGameId || !from || !to) return;

            try {
                showStatus('Виконання ходу...');
                
                const response = await fetch(`${API_BASE}/${currentGameId}/move`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ from, to })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    // Save move for undo
                    moveHistory.push({
                        from: { ...from },
                        to: { ...to },
                        card: { ...selectedCard },
                        previousGameState: JSON.parse(JSON.stringify(gameState))
                    });
                    
                    gameState = data.data.gameState;
                    moveCount++;
                    updateDisplay();
                    clearSelection();
                    
                    if (gameState.gameWon) {
                        showStatus('🏆 Перемога!');
                        stopTimer();
                    } else {
                        showStatus(`Хід виконано! Ходів: ${moveCount}`);
                    }
                    
                } else {
                    showStatus(`Неможливий хід: ${data.error}`);
                    setTimeout(() => {
                        if (selectedCard) {
                            showStatus(`Обрано: ${selectedCard.rank}${SUIT_SYMBOLS[selectedCard.suit]}. Оберіть куди перемістити`);
                        } else {
                            showStatus('Оберіть карту для ходу');
                        }
                    }, 2000);
                }
            } catch (error) {
                console.error('Помилка ходу:', error);
                showError(`Помилка ходу: ${error.message}`);
                showStatus('Помилка виконання ходу');
            }
        }

        function showWinMessage() {
            stopTimer();
            document.getElementById('final-moves').textContent = moveCount;
            document.getElementById('final-time').textContent = document.getElementById('timer').textContent;
            document.getElementById('win-message').style.display = 'block';
        }

        function startTimer() {
            gameStartTime = Date.now();
            updateTimer(); // Initial update
            timerInterval = setInterval(updateTimer, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimer() {
            if (!gameStartTime) return;
            
            const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            
            document.getElementById('timer').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        async function autoMove() {
            if (!gameState || !currentGameId) return;

            // Try to auto-move aces and low cards to foundations
            for (let i = 0; i < gameState.tableau.length; i++) {
                const pile = gameState.tableau[i];
                if (pile.length > 0) {
                    const topCard = pile[pile.length - 1];
                    const foundationPile = gameState.foundations[topCard.suit];
                    
                    if (isValidFoundationMove(topCard, foundationPile)) {
                        await makeMove(
                            { type: 'tableau', index: i },
                            { type: 'foundation', key: topCard.suit }
                        );
                        return; // One move at a time
                    }
                }
            }

            // Try freecells
            for (let i = 0; i < gameState.freeCells.length; i++) {
                const card = gameState.freeCells[i];
                if (card) {
                    const foundationPile = gameState.foundations[card.suit];
                    if (isValidFoundationMove(card, foundationPile)) {
                        await makeMove(
                            { type: 'freeCell', index: i },
                            { type: 'foundation', key: card.suit }
                        );
                        return;
                    }
                }
            }

            showStatus('Немає автоматичних ходів');
            setTimeout(() => showStatus('Оберіть карту для ходу'), 2000);
        }

        function undoMove() {
            if (moveHistory.length === 0) return;

            const lastMove = moveHistory.pop();
            gameState = lastMove.previousGameState;
            moveCount--;
            updateDisplay();
            clearSelection();
            
            showStatus(`Хід скасовано. Ходів: ${moveCount}`);
        }

        function showRules() {
            alert(`🎮 ПРАВИЛА CLASSIC FREECELL:

🎯 МЕТА:
Перемістити всі карти в 4 фундаменти (♥♦♣♠) від туза до короля.

📋 ПРАВИЛА ХОДІВ:
• ТАБЛОН: карти різних кольорів по спаданню (К→Д→В→10...)
• ФУНДАМЕНТИ: карти однієї масті по зростанню (Т→2→3→4...)
• ВІЛЬНІ КОМІРКИ: можна розмістити будь-яку одну карту

🎮 УПРАВЛІННЯ:
• Клік на карту → вибрати
• Клік на місце → перемістити
• "Авто-хід" → автоматично перемістити доступні карти
• "Відмінити" → скасувати останній хід

💡 ПОРАДИ:
• Звільняйте вільні комірки якомога швидше
• Намагайтеся відкрити приховані карти
• Плануйте ходи наперед

Удачі! 🍀`);
        }

        // Handle clicks outside game elements
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.card') && 
                !e.target.closest('.cell') && 
                !e.target.closest('.foundation') && 
                !e.target.closest('.tableau-pile')) {
                clearSelection();
                if (gameState && !gameState.gameWon) {
                    showStatus('Оберіть карту для ходу');
                }
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                clearSelection();
                showStatus('Вибір скасовано');
            } else if (e.key === 'n' || e.key === 'N') {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    newGame();
                }
            } else if (e.key === 'z' || e.key === 'Z') {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    undoMove();
                }
            }
        });
    </script>
