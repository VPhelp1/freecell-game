<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 FreeCell Variants - Тестер</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 3em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .header p { font-size: 1.2em; opacity: 0.9; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .game-card { 
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); 
            border-radius: 15px; padding: 20px; border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s ease; cursor: pointer;
        }
        .game-card:hover { transform: translateY(-5px); }
        .game-card h3 { color: #ffd700; margin-bottom: 10px; font-size: 1.5em; }
        .game-card p { margin-bottom: 15px; line-height: 1.4; }
        .features { font-size: 0.9em; opacity: 0.8; margin-bottom: 15px; }
        .play-btn { 
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white; border: none; padding: 12px 24px;
            border-radius: 25px; cursor: pointer; font-size: 16px;
            transition: all 0.3s ease; width: 100%;
        }
        .play-btn:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .api-info { 
            background: rgba(0,0,0,0.2); border-radius: 10px; 
            padding: 20px; margin: 20px 0; text-align: center;
        }
        .controls { text-align: center; margin: 30px 0; }
        .controls button { 
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 10px 20px; margin: 10px; border-radius: 5px; cursor: pointer;
        }
        .game-area { 
            background: rgba(255,255,255,0.1); border-radius: 15px; 
            padding: 20px; margin: 20px 0; display: none; 
        }
        .game-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
        .info-card { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; }
        .move-section { margin: 20px 0; }
        .move-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 10px 0; }
        .move-controls div { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; }
        select, input { 
            padding: 8px; margin: 5px 0; border-radius: 4px; border: 1px solid #ddd; 
            width: 100%; background: rgba(255,255,255,0.9);
        }
        .output { 
            background: rgba(0,0,0,0.3); border-radius: 8px; padding: 15px; 
            font-family: 'Courier New', monospace; margin: 10px 0; 
            max-height: 200px; overflow-y: auto; white-space: pre-wrap;
        }
        .success { border-left: 4px solid #4CAF50; }
        .error { border-left: 4px solid #f44336; }
        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            .move-controls { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 FreeCell Variants</h1>
            <p>4 різні варіанти класичної гри FreeCell з backend валідацією</p>
        </div>

        <div class="api-info">
            <h3>🚀 API Статус</h3>
            <div id="api-status">Перевіряю підключення...</div>
        </div>

        <div class="games-grid" id="games-grid">
            <!-- Ігри будуть завантажені динамічно -->
        </div>

        <div class="controls">
            <button onclick="loadGameTypes()">🔄 Оновити список ігор</button>
            <button onclick="getStats()">📊 Статистика</button>
        </div>

        <!-- Область гри -->
        <div id="game-area" class="game-area">
            <h2>🎯 Активна гра</h2>
            
            <div class="game-info">
                <div class="info-card">
                    <h4>📋 Інформація</h4>
                    <div id="game-basic-info">Немає активної гри</div>
                </div>
                <div class="info-card">
                    <h4>📊 Таблон</h4>
                    <div id="tableau-info">-</div>
                </div>
                <div class="info-card">
                    <h4>🔓 Вільні комірки</h4>
                    <div id="freecells-info">-</div>
                </div>
                <div class="info-card">
                    <h4>🏆 Фундаменти</h4>
                    <div id="foundations-info">-</div>
                </div>
            </div>

            <div class="move-section">
                <h3>🎯 Зробити хід</h3>
                <div class="move-controls">
                    <div>
                        <label>Звідки:</label>
                        <select id="from-type">
                            <option value="tableau">Таблон</option>
                            <option value="freeCell">Вільна комірка</option>
                        </select>
                        <input type="number" id="from-index" placeholder="Індекс (0-9)" min="0" max="9" value="0">
                    </div>
                    <div>
                        <label>Куди:</label>
                        <select id="to-type" onchange="toggleFoundationKey()">
                            <option value="tableau">Таблон</option>
                            <option value="freeCell">Вільна комірка</option>
                            <option value="foundation">Фундамент</option>
                        </select>
                        <input type="number" id="to-index" placeholder="Індекс (0-9)" min="0" max="9" value="1">
                        <select id="to-key" style="display:none;">
                            <option value="hearts">Черви (♥)</option>
                            <option value="diamonds">Буби (♦)</option>
                            <option value="clubs">Хрести (♣)</option>
                            <option value="spades">Піки (♠)</option>
                        </select>
                    </div>
                </div>
                <button class="play-btn" onclick="makeMove()" id="move-btn" disabled>🎯 Зробити хід</button>
                <div id="move-result" class="output"></div>
            </div>

            <div class="controls">
                <button onclick="getGameState()">🔄 Оновити стан</button>
                <button onclick="resetGame()">↻ Скинути гру</button>
            </div>
        </div>
    </div>

    <script>
        let currentGameId = null;
        const API_BASE = '/api/games';

        // Перевірка API при завантаженні
        window.addEventListener('load', async () => {
            await checkAPI();
            await loadGameTypes();
        });

        async function checkAPI() {
            try {
                const response = await fetch('/');
                const data = await response.json();
                document.getElementById('api-status').innerHTML = `
                    ✅ <strong>API працює!</strong><br>
                    Версія: ${data.version}<br>
                    Готовий до гри! 🎮
                `;
            } catch (error) {
                document.getElementById('api-status').innerHTML = `
                    ❌ <strong>Помилка API:</strong> ${error.message}
                `;
            }
        }

        async function loadGameTypes() {
            try {
                const response = await fetch(`${API_BASE}/types`);
                const data = await response.json();
                
                const grid = document.getElementById('games-grid');
                grid.innerHTML = '';

                data.data.forEach(gameType => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <h3>${gameType.name}</h3>
                        <p>${gameType.description}</p>
                        <div class="features">
                            🔓 Вільні комірки: ${gameType.features.freeCells} | 
                            🃏 Колоди: ${gameType.features.decks} | 
                            📏 Правило: ${gameType.features.moveRule === 'alternating_color' ? 'Різні кольори' : 'Та ж масть'}
                        </div>
                        <button class="play-btn" onclick="createGame('${gameType.type}', '${gameType.name}')">
                            🎮 Грати ${gameType.name}
                        </button>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                document.getElementById('games-grid').innerHTML = `
                    <div class="game-card">❌ Помилка завантаження ігор: ${error.message}</div>
                `;
            }
        }

        async function createGame(gameType, gameName) {
            try {
                const response = await fetch(`${API_BASE}/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gameType })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentGameId = data.data.gameId;
                    document.getElementById('game-area').style.display = 'block';
                    document.getElementById('move-btn').disabled = false;
                    
                    displayGameState(data.data.gameState);
                    
                    // Scroll до гри
                    document.getElementById('game-area').scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert(`❌ Помилка створення гри: ${data.error}`);
                }
            } catch (error) {
                alert(`❌ Помилка запиту: ${error.message}`);
            }
        }

        function displayGameState(gameState) {
            // Основна інформація
            document.getElementById('game-basic-info').innerHTML = `
                <strong>${gameState.config.name}</strong><br>
                Ходів: ${gameState.moveCount}<br>
                Статус: ${gameState.gameWon ? '🏆 ПЕРЕМОГА!' : '🎮 Гра триває'}<br>
                ID: ${currentGameId ? currentGameId.substring(0, 8) + '...' : 'N/A'}
            `;

            // Таблон
            const tableauInfo = gameState.tableau.map((pile, i) => {
                const topCard = pile.length > 0 ? pile[pile.length - 1] : null;
                const cardDisplay = topCard ? `${getCardSymbol(topCard.suit)} ${topCard.rank}` : 'пуста';
                return `Стовп ${i}: ${pile.length} карт (${cardDisplay})`;
            }).join('\n');
            document.getElementById('tableau-info').textContent = tableauInfo;

            // Вільні комірки
            const freeCellsInfo = gameState.freeCells.map((card, i) => {
                const cardDisplay = card ? `${getCardSymbol(card.suit)} ${card.rank}` : 'пуста';
                return `Комірка ${i}: ${cardDisplay}`;
            }).join('\n');
            document.getElementById('freecells-info').textContent = freeCellsInfo;

            // Фундаменти
            const foundationsInfo = Object.entries(gameState.foundations).map(([key, pile]) => {
                const topCard = pile.length > 0 ? pile[pile.length - 1] : null;
                const cardDisplay = topCard ? `${topCard.rank}` : 'пустий';
                return `${getCardSymbol(key.split('_')[0])}: ${pile.length} карт (${cardDisplay})`;
            }).join('\n');
            document.getElementById('foundations-info').textContent = foundationsInfo;
        }

        function getCardSymbol(suit) {
            const symbols = {
                'hearts': '♥',
                'diamonds': '♦',
                'clubs': '♣',
                'spades': '♠'
            };
            return symbols[suit] || suit;
        }

        async function makeMove() {
            if (!currentGameId) return;
            
            const fromType = document.getElementById('from-type').value;
            const fromIndex = parseInt(document.getElementById('from-index').value);
            const toType = document.getElementById('to-type').value;
            const toIndex = parseInt(document.getElementById('to-index').value);
            
            const from = { type: fromType, index: fromIndex };
            const to = { type: toType, index: toIndex };
            
            if (toType === 'foundation') {
                to.key = document.getElementById('to-key').value;
            }
            
            try {
                const response = await fetch(`${API_BASE}/${currentGameId}/move`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ from, to })
                });
                
                const data = await response.json();
                const resultDiv = document.getElementById('move-result');
                
                if (data.success) {
                    const card = data.data.move.card;
                    resultDiv.innerHTML = `✅ Хід успішний!\nКарта: ${getCardSymbol(card.suit)} ${card.rank}`;
                    resultDiv.className = 'output success';
                    
                    displayGameState(data.data.gameState);
                    
                    if (data.data.gameState.gameWon) {
                        setTimeout(() => alert('🏆 ВІТАЮ! ВИ ПЕРЕМОГЛИ!'), 500);
                    }
                } else {
                    resultDiv.innerHTML = `❌ ${data.error}`;
                    resultDiv.className = 'output error';
                }
            } catch (error) {
                const resultDiv = document.getElementById('move-result');
                resultDiv.innerHTML = `❌ Помилка запиту: ${error.message}`;
                resultDiv.className = 'output error';
            }
        }

        async function getGameState() {
            if (!currentGameId) return;
            
            try {
                const response = await fetch(`${API_BASE}/${currentGameId}`);
                const data = await response.json();
                
                if (data.success) {
                    displayGameState(data.data);
                }
            } catch (error) {
                console.error('Помилка отримання стану:', error);
            }
        }

        async function resetGame() {
            if (!currentGameId || !confirm('Скинути поточну гру?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/${currentGameId}/reset`, { method: 'POST' });
                const data = await response.json();
                
                if (data.success) {
                    displayGameState(data.data);
                    document.getElementById('move-result').innerHTML = '🔄 Гру скинуто!';
                    document.getElementById('move-result').className = 'output success';
                }
            } catch (error) {
                console.error('Помилка скидання:', error);
            }
        }

        async function getStats() {
            try {
                const response = await fetch(`${API_BASE}/stats/overview`);
                const data = await response.json();
                
                if (data.success) {
                    const stats = data.data;
                    const statsText = `📊 Статистика серверу:\nВсього активних ігор: ${stats.totalGames}`;
                    alert(statsText);
                }
            } catch (error) {
                alert(`Помилка статистики: ${error.message}`);
            }
        }

        function toggleFoundationKey() {
            const toType = document.getElementById('to-type').value;
            const keyField = document.getElementById('to-key');
            keyField.style.display = toType === 'foundation' ? 'block' : 'none';
        }
    </script>
</body>
</html>
