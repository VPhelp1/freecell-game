<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeCell Game - Test</title>
    <style>
        body { 
            background: #1a472a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container { padding: 20px; }
        h1 { font-size: 2em; margin-bottom: 20px; }
        .status { 
            background: rgba(0,0,0,0.3); 
            padding: 20px; 
            border-radius: 10px; 
            margin: 20px 0;
        }
        .success { color: #4CAF50; }
        .info { color: #2196F3; }
        .button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 1.2em;
            cursor: pointer;
            margin: 10px;
            display: inline-block;
            text-decoration: none;
        }
        .button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 FreeCell Test Page</h1>
        <div class="status">
            <p class="success">✅ Vercel deployment works!</p>
            <p class="info">🟢 Background color: #1a472a (green)</p>
            <p>📱 Mobile-friendly: Yes</p>
            <p>🚀 API: No dependency</p>
        </div>
        <p>Loading main game...</p>
        <script>
            setTimeout(function() {
                window.location.href = 'index.html';
            }, 3000);
        </script>
        <a href="index.html" class="button">Go to Game</a>
    </div>
</body>
</html>
