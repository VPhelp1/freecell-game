<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 FreeCell - Game Loading...</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 700px;
        }
        h1 { margin: 0 0 20px 0; font-size: 2.5em; }
        p { margin: 10px 0; opacity: 0.9; }
        .link {
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 25px;
            margin-top: 20px;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .link:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        .spinner {
            margin: 30px 0;
            font-size: 3em;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .steps {
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 0.95em;
        }
        .highlight {
            background: rgba(255,215,0,0.2);
            padding: 3px 8px;
            border-radius: 5px;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 FreeCell</h1>
        <div class="spinner">⏳</div>
        <p>Завантаження гри...</p>
        
        <a href="full-game.html" class="link">▶️ Почати гру</a>
        
        <div class="steps">
            <p><strong>Якщо не відкрилося автоматично:</strong></p>
            <ol style="padding-left: 20px; line-height: 1.8; margin-top: 10px;">
                <li>Натисни кнопку <span class="highlight">"Почати гру"</span> вище</li>
                <li>Або відкрий файл <span class="highlight">full-game.html</span> в браузере</li>
            </ol>
        </div>
        
        <p style="margin-top: 20px; font-size: 0.9em; opacity: 0.7;">
            4 варіанти гри • Безкоштовно • Без реєстрації
        </p>
    </div>
    
    <script>
        // Auto-redirect after 2 seconds
        setTimeout(() => {
            window.location.href = 'full-game.html';
        }, 2000);
    </script>
</body>
</html>
